[package]
name = "openharness"
version = "0.1.0"
description = "Native macOS desktop host for OpenHarness"
authors = ["MicroSpotlight"]
license = "Apache-2.0"
repository = "https://github.com/MicroSpotlight/OpenHarness"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
url = "2"
libc = "0.2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde_json = "1"
semver = "1"

[profile.release]
strip = true
