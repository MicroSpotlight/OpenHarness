name: Deploy landing page to GitHub Pages

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag whose update manifest should be deployed
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag whose update manifest should be deployed
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble site with release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release-tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          site_dir="${RUNNER_TEMP}/pages"
          release_dir="${RUNNER_TEMP}/release"
          mkdir -p "${site_dir}" "${release_dir}"
          cp -R docs/. "${site_dir}/"

          release_tag="${REQUESTED_RELEASE_TAG}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=5" \
                --jq 'map(select(.draft == false and ([.assets[].name] | any(. == "version.json" or . == "latest.json")))) | sort_by(.published_at) | reverse | first | .tag_name // ""'
            )"
          fi

          if [[ -n "${release_tag}" ]]; then
            manifest_name="$(
              gh release view "${release_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '[.assets[].name] | if index("version.json") != null then "version.json" elif index("latest.json") != null then "latest.json" else "" end'
            )"
            if [[ -z "${manifest_name}" ]]; then
              echo "Release ${release_tag} does not contain version.json or latest.json" >&2
              exit 1
            fi

            gh release download "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${manifest_name}" \
              --dir "${release_dir}"
            node scripts/update-manifest.mjs validate \
              --input "${release_dir}/${manifest_name}"
            cp "${release_dir}/${manifest_name}" "${site_dir}/latest.json"
            echo "Deploying ${release_tag} ${manifest_name} as latest.json"
          else
            echo "No published Release contains an update manifest; deploying the landing page without release metadata"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
